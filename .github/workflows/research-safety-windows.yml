name: Nexus research safety regression
on:
  push:
    branches:
      - development/windows-portal-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    name: offline-regression-${{ matrix.shard }}-of-2
    runs-on: windows-latest
    # Exact v0.340.299 reached 5,423 passes / 90% after 89m06s on hosted
    # Python 3.11 before the 90-minute outer deadline cancelled the tail.
    # Keep the complete suite bounded with measured load/runtime headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind job to exact source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked-out source does not match the exact workflow source commit' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile Python source
        run: python -m compileall -q nexus tests ops
      - name: Run complete Python regression suite
        run: python -m pytest -q -p ops.pytest_shard --nexus-shard-index ${{ matrix.shard }} --nexus-shard-count 2

  offline-release-evidence:
    runs-on: windows-latest
    # Exact v0.340.386 run 44804652797 exhausted the former 15-minute outer
    # budget while its bounded profiles were still running.  The profiles keep
    # their own fail-closed child limits; this remains a finite orchestration cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind job to exact source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked-out source does not match the exact workflow source commit' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Run bounded offline release trials
        run: python -m nexus.release_trials --output release-trial-evidence/report.json
      - name: Revalidate saved offline evidence against this source
        run: python -m nexus.release_evidence release-trial-evidence/report.json
      - name: Retain source-fingerprinted release trials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-trial-evidence
          path: release-trial-evidence
          retention-days: 30
          if-no-files-found: warn

  portal-browser-help:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind job to exact source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked-out source does not match the exact workflow source commit' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Install headless browser for control-help acceptance
        run: python -m playwright install chromium --only-shell
      - name: Verify real-browser control help with isolated fixtures
        run: python tools/portal_browser_smoke.py --output browser-evidence --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Retain browser screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-browser-evidence
          path: browser-evidence
          retention-days: 30
          if-no-files-found: warn
