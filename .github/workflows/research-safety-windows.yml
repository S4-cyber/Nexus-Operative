name: Nexus research safety regression
on:
  push:
    branches:
      - development/windows-portal-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Compile Python source
        run: python -m compileall -q nexus tests
      - name: Run complete Python regression suite
        run: python -m pytest -q

      - name: Run bounded offline release trials
        run: python -m nexus.release_trials --output release-trial-evidence/report.json
      - name: Retain source-fingerprinted release trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-trial-evidence
          path: release-trial-evidence
          retention-days: 30
          if-no-files-found: warn

      - name: Install headless browser for control-help acceptance
        run: python -m playwright install chromium --only-shell
      - name: Verify real-browser control help with isolated fixtures
        run: python tools/portal_browser_smoke.py --output browser-evidence
      - name: Retain browser screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-evidence
          path: browser-evidence
          retention-days: 30
          if-no-files-found: warn
