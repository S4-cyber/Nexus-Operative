name: Nexus research safety regression
on:
  push:
    branches:
      - development/windows-portal-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python source
        run: python -m compileall -q nexus tests
      - name: Run offline advisory and candle integrity regressions
        run: python -m pytest -q tests/test_advisory_benchmark.py tests/test_historical_candles.py tests/test_candle_calendar_guard.py
