name: Windows simulated-research build
on:
  push:
    branches:
      - development/windows-portal-foundation
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Build this reviewed development source branch'
        type: choice
        required: true
        default: development/windows-portal-foundation
        options:
          - development/windows-portal-foundation
concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.source_branch || 'development/windows-portal-foundation' }}
      - name: Require application source
        shell: pwsh
        run: |
          if (!(Test-Path pyproject.toml) -or !(Test-Path portable/desktop.py)) {
            throw 'Nexus application source has not yet been imported. No EXE will be produced from placeholder code.'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pyinstaller>=6,<7"
          python -m pytest -q
      - name: Validate PORTAL JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content 'dashboard/portal_preview.html' -Raw -Encoding UTF8
          if (([regex]::Matches($html, '<script>')).Count -ne 1 -or
              ([regex]::Matches($html, '</script>')).Count -ne 1 -or
              ([regex]::Matches($html, '</html>')).Count -ne 1 -or
              -not $html.TrimEnd().EndsWith('</html>')) {
            throw 'PORTAL HTML document is malformed or has duplicate script content'
          }
          $code = [regex]::Match($html, '(?s)<script>(.*?)</script>').Groups[1].Value
          if (-not $code) { throw 'PORTAL JavaScript missing' }
          Set-Content -Path "$env:RUNNER_TEMP/portal_validate.js" -Value $code -Encoding UTF8
          node --check "$env:RUNNER_TEMP/portal_validate.js"
          if ($LASTEXITCODE -ne 0) { throw 'PORTAL JavaScript syntax check failed' }
      - name: Package standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name NexusOperative --collect-submodules nexus --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --collect-submodules webview --collect-submodules keyring --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on --add-data "dashboard;dashboard" portable/desktop.py
          if (!(Test-Path dist/NexusOperative.exe)) { throw 'EXE missing' }
      - name: Verify EXE starts
        shell: pwsh
        run: |
          $env:NEXUS_BROWSER_MODE = '1'
          $proc = Start-Process -FilePath ".\dist\NexusOperative.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "NexusOperative.exe exited early: $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/api/status' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw 'Desktop backend did not become ready' }
            $portal = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/portal' -TimeoutSec 3
            if ($portal.StatusCode -ne 200 -or $portal.Content -notmatch 'PORTAL') { throw 'Bundled PORTAL UI smoke test failed' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: NexusOperative-Standalone-Windows
          path: dist/NexusOperative.exe
          if-no-files-found: error
          retention-days: 30
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (!(Test-Path installer/NexusOperative.iss)) { throw 'Inno Setup definition missing' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not present; install a trusted version first' }
          New-Item -ItemType Directory -Force release/NexusOperative | Out-Null
          Copy-Item dist/NexusOperative.exe release/NexusOperative/NexusOperative.exe
          & $iscc installer/NexusOperative.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify installed application, reinstall and data-preserving uninstall
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $installer = (Resolve-Path "release/NexusOperative-Setup-$version.exe").Path
          ./tools/windows_installer_smoke.ps1 -Installer $installer -Version $version -EvidenceDirectory "$env:RUNNER_TEMP/nexus-installer-evidence"
      - name: Create distribution checksum manifest
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $sourceCommit = git rev-parse HEAD
          Copy-Item dist/NexusOperative.exe release/NexusOperative.exe
          python -m nexus.artifact_manifest create --version $version --commit $sourceCommit --output release/artifact-manifest.json release/NexusOperative.exe "release/NexusOperative-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest creation failed' }
          python -m nexus.artifact_manifest verify release/artifact-manifest.json release
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed' }
      - name: Upload distribution with source and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: NexusOperative-Windows-Distribution
          path: |
            release/NexusOperative.exe
            release/NexusOperative-Setup-*.exe
            release/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusOperative-Installer-Smoke-Evidence
          path: ${{ runner.temp }}/nexus-installer-evidence
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: NexusOperative-Windows-Installer
          path: release/NexusOperative-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

