name: Windows simulated-research build
on:
  workflow_dispatch:
  push:
    branches: [main, 'development/**']
    paths:
      - 'nexus/**'
      - 'portable/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require application source
        shell: pwsh
        run: |
          if (!(Test-Path pyproject.toml) -or !(Test-Path portable/desktop.py)) {
            throw 'Nexus application source has not yet been imported. No EXE will be produced from placeholder code.'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pyinstaller>=6,<7"
          python -m pytest -q
      - name: Package standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name NexusOperative --collect-submodules nexus --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on portable/desktop.py
          if (!(Test-Path dist/NexusOperative.exe)) { throw 'EXE missing' }
      - name: Verify EXE starts
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\NexusOperative.exe" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 6
            if ($proc.HasExited) { throw "NexusOperative.exe exited early: $($proc.ExitCode)" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NexusOperative-Windows-EXE
          path: dist/NexusOperative.exe
          if-no-files-found: error
          retention-days: 7
