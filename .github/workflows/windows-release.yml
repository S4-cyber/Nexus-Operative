name: Windows simulated-research build
on:
  push:
    branches:
      - development/windows-portal-foundation
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Build this reviewed development source branch'
        type: choice
        required: true
        default: development/windows-portal-foundation
        options:
          - development/windows-portal-foundation
      source_commit:
        description: 'Optional exact 40-character commit descended from the current development head'
        type: string
        required: false
        default: ''
concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    # Exact development run 43595758062 passed the complete regression,
    # PyInstaller, install/reinstall, prior-version recovery, uninstall and
    # phase review before the old 120m deadline cancelled the source-bound
    # distribution-evidence tail. Keep one finite lane with measured margin.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_commit || inputs.source_branch || 'development/windows-portal-foundation' }}
      - name: Bind evidence to an exact reviewed source commit
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          $eventName = '${{ github.event_name }}'
          $requested = "$env:REQUESTED_SOURCE_COMMIT".Trim()
          if ($eventName -eq 'push' -and $actual -ne $env:GITHUB_SHA) {
            throw 'Checked-out source does not match triggering push SHA'
          }
          if ($eventName -eq 'workflow_dispatch') {
            git fetch --no-tags origin development/windows-portal-foundation:refs/remotes/origin/development/windows-portal-foundation
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh the reviewed development head' }
            $development = git rev-parse refs/remotes/origin/development/windows-portal-foundation
            if ($requested) {
              if ($requested -cnotmatch '^[0-9a-f]{40}$') {
                throw 'Manual source commit must be one exact lowercase 40-character SHA'
              }
              if ($actual -cne $requested) {
                throw 'Checked-out source does not match requested exact commit'
              }
              git merge-base --is-ancestor $development $actual
              if ($LASTEXITCODE -ne 0) {
                throw 'Requested source commit is not descended from the current development head'
              }
            } elseif ($actual -ne $development) {
              throw 'Mutable development dispatch did not resolve to its refreshed head'
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "NEXUS_SOURCE_COMMIT=$actual" -Encoding UTF8
      - name: Check out pinned prior-version recovery fixture source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Must predate the target while retaining the trusted terminal-clock
          # evidence required by current fail-closed recovery review.
          ref: 5660ec19d66af6401d3bd4e6c271b6e8dc2bf461
          path: .upgrade-source
      - name: Require application source
        shell: pwsh
        run: |
          if (!(Test-Path pyproject.toml) -or !(Test-Path portable/desktop.py)) {
            throw 'Nexus application source has not yet been imported. No EXE will be produced from placeholder code.'
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pyinstaller>=6,<7"
          python -m pytest -q
      - name: Validate PORTAL JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content 'dashboard/portal_preview.html' -Raw -Encoding UTF8
          if (([regex]::Matches($html, '<script>')).Count -ne 1 -or
              ([regex]::Matches($html, '</script>')).Count -ne 1 -or
              ([regex]::Matches($html, '</html>')).Count -ne 1 -or
              -not $html.TrimEnd().EndsWith('</html>')) {
            throw 'PORTAL HTML document is malformed or has duplicate script content'
          }
          $code = [regex]::Match($html, '(?s)<script>(.*?)</script>').Groups[1].Value
          if (-not $code) { throw 'PORTAL JavaScript missing' }
          Set-Content -Path "$env:RUNNER_TEMP/portal_validate.js" -Value $code -Encoding UTF8
          node --check "$env:RUNNER_TEMP/portal_validate.js"
          if ($LASTEXITCODE -ne 0) { throw 'PORTAL JavaScript syntax check failed' }
      - name: Package standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name NexusOperative --collect-submodules nexus --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --collect-submodules webview --collect-submodules keyring --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on --add-data "dashboard;dashboard" portable/desktop.py
          if (!(Test-Path dist/NexusOperative.exe)) { throw 'EXE missing' }
      - name: Verify standalone private paper tools without desktop startup
        shell: pwsh
        run: |
          python tools/packaged_paper_tools_smoke.py --executable dist/NexusOperative.exe --output "$env:RUNNER_TEMP/nexus-installer-evidence/standalone-paper-tools.json"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone paper operator tools failed' }
      - name: Verify EXE starts
        shell: pwsh
        run: |
          $env:NEXUS_BROWSER_MODE = '1'
          $proc = Start-Process -FilePath ".\dist\NexusOperative.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "NexusOperative.exe exited early: $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/api/status' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw 'Desktop backend did not become ready' }
            $portal = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/portal' -TimeoutSec 3
            if ($portal.StatusCode -ne 200 -or $portal.Content -notmatch 'PORTAL') { throw 'Bundled PORTAL UI smoke test failed' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (!(Test-Path installer/NexusOperative.iss)) { throw 'Inno Setup definition missing' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not present; install a trusted version first' }
          New-Item -ItemType Directory -Force release/NexusOperative | Out-Null
          Copy-Item dist/NexusOperative.exe release/NexusOperative/NexusOperative.exe
          & $iscc installer/NexusOperative.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify installed application, reinstall and data-preserving uninstall
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $installer = (Resolve-Path "release/NexusOperative-Setup-$version.exe").Path
          ./tools/windows_installer_smoke.ps1 -Installer $installer -Version $version -EvidenceDirectory "$env:RUNNER_TEMP/nexus-installer-evidence" -UpgradeSource "$PWD/.upgrade-source" -UpgradeCommit "5660ec19d66af6401d3bd4e6c271b6e8dc2bf461" -SourceCommit $env:NEXUS_SOURCE_COMMIT
      - name: Validate installer phase evidence
        timeout-minutes: 1
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $installer = (Resolve-Path "release/NexusOperative-Setup-$version.exe").Path
          python tools/windows_installer_phase_review.py --input "$env:RUNNER_TEMP/nexus-installer-evidence/installer-phases.jsonl" --installer $installer --expected-version $version --expected-source-commit $env:NEXUS_SOURCE_COMMIT --output "$env:RUNNER_TEMP/nexus-installer-evidence/installer-phase-review.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installer phase evidence validation failed' }
          python tools/windows_installer_result_review.py --input "$env:RUNNER_TEMP/nexus-installer-evidence/installer-result.json" --phase-review "$env:RUNNER_TEMP/nexus-installer-evidence/installer-phase-review.json" --expected-version $version --expected-source-commit $env:NEXUS_SOURCE_COMMIT --output "$env:RUNNER_TEMP/nexus-installer-evidence/installer-result-review.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installer result evidence validation failed' }
      - name: Create distribution checksum manifest
        timeout-minutes: 20
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $sourceCommit = git rev-parse HEAD
          Copy-Item dist/NexusOperative.exe release/NexusOperative.exe
          Copy-Item tools/windows_owner_profile_probe.ps1 release/windows-owner-profile-probe.ps1
          Copy-Item tools/windows_owner_profile_review.py release/windows-owner-profile-review.py
          Copy-Item "$env:RUNNER_TEMP/nexus-installer-evidence/installer-result-review.json" release/installer-result-review.json
          python -m nexus.release_trials --output release/release-trial-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Distribution offline trials failed' }
          python -m nexus.release_evidence release/release-trial-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Distribution evidence validation failed' }
          python -m nexus.artifact_manifest create --version $version --commit $sourceCommit --output release/artifact-manifest.json release/NexusOperative.exe "release/NexusOperative-Setup-$version.exe" release/release-trial-evidence.json release/installer-result-review.json release/windows-owner-profile-probe.ps1 release/windows-owner-profile-review.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest creation failed' }
          python -m nexus.artifact_manifest verify release/artifact-manifest.json release
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed' }
          python tools/windows_distribution_binding_review.py --phase-review "$env:RUNNER_TEMP/nexus-installer-evidence/installer-phase-review.json" --installer-result-review release/installer-result-review.json --artifact-manifest release/artifact-manifest.json --installer "release/NexusOperative-Setup-$version.exe" --expected-version $version --expected-source-commit $env:NEXUS_SOURCE_COMMIT --output "$env:RUNNER_TEMP/nexus-installer-evidence/distribution-binding-review.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installer distribution binding validation failed' }
          Copy-Item "$env:RUNNER_TEMP/nexus-installer-evidence/distribution-binding-review.json" release/distribution-binding-review.json
          python -m nexus.artifact_manifest create --version $version --commit $sourceCommit --output release/distribution-envelope.json release/artifact-manifest.json release/distribution-binding-review.json
          if ($LASTEXITCODE -ne 0) { throw 'Distribution envelope creation failed' }
          python -m nexus.artifact_manifest verify release/distribution-envelope.json release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution envelope verification failed' }
      - name: Validate exact installer upload set
        timeout-minutes: 1
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $expected = (Resolve-Path "release/NexusOperative-Setup-$version.exe").Path
          $installers = @(Get-ChildItem release -File -Filter 'NexusOperative-Setup-*.exe')
          if ($installers.Count -ne 1 -or $installers[0].FullName -cne $expected) {
            throw 'Distribution contains an unreviewed or ambiguous installer set'
          }
          python -m nexus.artifact_manifest verify release/artifact-manifest.json release
          if ($LASTEXITCODE -ne 0) { throw 'Final artifact manifest verification failed' }
          python -m nexus.artifact_manifest verify release/distribution-envelope.json release
          if ($LASTEXITCODE -ne 0) { throw 'Final distribution envelope verification failed' }
      - name: Upload distribution with source and checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexusOperative-Windows-Distribution
          path: |
            release/NexusOperative.exe
            release/NexusOperative-Setup-*.exe
            release/artifact-manifest.json
            release/distribution-envelope.json
            release/release-trial-evidence.json
            release/installer-result-review.json
            release/distribution-binding-review.json
            release/windows-owner-profile-probe.ps1
            release/windows-owner-profile-review.py
          if-no-files-found: error
          retention-days: 30
      - name: Preserve installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexusOperative-Installer-Smoke-Evidence
          path: ${{ runner.temp }}/nexus-installer-evidence
          if-no-files-found: warn
          retention-days: 30

