[project]
name = "nexus-operative"
version = "0.166.1"
description = "Simulated trading research and Nexus PORTAL desktop application"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3", "cryptography>=42,<48", "pywebview>=5,<7", "keyring>=25,<27"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ui = ["playwright>=1.50,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nexus"]

